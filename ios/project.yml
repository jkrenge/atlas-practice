name: Atlas
options:
  bundleIdPrefix: com.jkrenge
  deploymentTarget:
    iOS: '18.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: '18.0'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  Atlas:
    type: application
    platform: iOS
    sources:
      - path: Atlas
      - path: ../maps
        type: folder
        buildPhase: resources
      - path: ../content
        type: folder
        buildPhase: resources
    postBuildScripts:
      - name: Exclude detailed source geometry
        basedOnDependencyAnalysis: false
        script: |
          for folder in "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/maps/"*; do
            if [ -f "$folder/areas-lowres.geojson" ]; then
              rm -f "$folder/areas.geojson"
            fi
          done
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jkrenge.geography
        DEVELOPMENT_TEAM: 8433V6NWHP
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Atlas Practice
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        SWIFT_EMIT_LOC_STRINGS: YES
  AtlasTests:
    type: bundle.unit-test
    platform: iOS
    sources: AtlasTests
    dependencies:
      - target: Atlas
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  AtlasUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: AtlasUITests
    dependencies:
      - target: Atlas
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Atlas:
    build:
      targets:
        Atlas: all
    test:
      targets:
        - AtlasTests
        - AtlasUITests
      gatherCoverageData: true
